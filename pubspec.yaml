name: sesha_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  go_router: ^13.0.0
  flutter_native_splash: ^2.3.9
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  url_launcher: ^6.3.0
  image_picker: ^1.0.7
  video_player: ^2.8.6
  flutter_launcher_icons: ^0.13.1
  pdf: ^3.10.8
  printing: ^5.12.0
  http: ^1.2.1
  file_picker: ^8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/

flutter_native_splash:
  color: "#ffffff"
  image: assets/img/fav.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/icon.png"